name: Docs

# 自动发布已关闭：当前仓库为 private，免费账号无法为私有仓库启用 GitHub Pages，
# 推送到 dev/master 时会因 configure-pages 找不到 Pages site 而失败。
#
# 恢复方式（任选其一）：
#   1. 仓库转为 public，然后在 Settings -> Pages 将 Source 设为 GitHub Actions；
#   2. 升级到支持私有仓库 Pages 的套餐并启用 Pages。
# 完成上述任一步后，取消下面 push 触发器的注释即可恢复自动部署。
#
# 关闭期间本地校验文档：
#   python -m mkdocs build --strict

on:
  # push:
  #   branches:
  #     - master
  #     - main
  #     - dev
  #   paths:
  #     - "docs/**"
  #     - "mkdocs.yml"
  #     - "requirements-docs.txt"
  #     - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
