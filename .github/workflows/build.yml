name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'

# 默认的 GITHUB_TOKEN 只读，创建 Release 需要显式授予 contents: write
permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "zengliugen@users.noreply.github.com"
          git config --global user.name "zengliugen"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install --no-deps -r requirements.txt

      - name: inline_ok_requirements #把ok-script加入源码, 从requirements.txt中删除以提高升级更新速度
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        # 复用 run_tests.ps1：测试收集逻辑只维护一处，避免 CI 与本地行为漂移。
        # 该脚本遍历两个根并在任一文件失败时以非 0 退出，CI 因此能真正阻断：
        #   tests/            —— 上游基线测试
        #   extensions_tests/ —— 项目扩展测试
        # 两层测试同时跑，但结论不可混为一谈：tests/ 过 = 上游行为没被我们破坏；
        # extensions_tests/ 过 = 扩展自身按预期工作，与上游行为无关。
        # 显式用 pwsh 执行：不依赖 .ps1 文件关联，且 -File 会把脚本退出码透传给步骤。
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./run_tests.ps1

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master #使用pyappify打包exe
        with:
          # 固定 pyappify 版本，避免上游更新导致构建结果漂移
          version: 'v1.2.3'

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          body: |
            ###  更新日志
              本次发布 ${{ github.ref_name }}
            ### 下载包说明
              * [ok-script-app-pro-win32-China-setup.exe](https://github.com/zengliugen/ok-script-app-pro/releases/download/${{ github.ref_name }}/ok-script-app-pro-win32-China-setup.exe) 完整安装包（China profile）
              * [ok-script-app-pro-win32-Global-setup.exe](https://github.com/zengliugen/ok-script-app-pro/releases/download/${{ github.ref_name }}/ok-script-app-pro-win32-Global-setup.exe) full package with dependencies (Global profile)
              * [ok-script-app-pro-win32-Web-setup.exe](https://github.com/zengliugen/ok-script-app-pro/releases/download/${{ github.ref_name }}/ok-script-app-pro-win32-Web-setup.exe) web UI package (Web profile)
              * [ok-script-app-pro-win32-online-setup.exe](https://github.com/zengliugen/ok-script-app-pro/releases/download/${{ github.ref_name }}/ok-script-app-pro-win32-online-setup.exe) 在线安装包, 首次启动时拉取源码与依赖
              * [ok-script-app-pro-win32.zip](https://github.com/zengliugen/ok-script-app-pro/releases/download/${{ github.ref_name }}/ok-script-app-pro-win32.zip) 免安装压缩包
          files: pyappify_dist/*

      # 默认关闭，需要在仓库 Variables 中设置 MIRRORCHYAN_ENABLED=true 才会触发上传
      - name: Trigger MirrorChyanUploading
        if: startsWith(github.ref, 'refs/tags/') && vars.MIRRORCHYAN_ENABLED == 'true'
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_uploading.yml -f tag=${{ github.ref_name }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
