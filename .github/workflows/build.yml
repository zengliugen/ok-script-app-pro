name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'

jobs:
  build:

    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "zengliugen@users.noreply.github.com"
          git config --global user.name "zengliugen"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install --no-deps -r requirements.txt

      - name: inline_ok_requirements #把ok-script加入源码, 从requirements.txt中删除以提高升级更新速度
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: |
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
          }

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master #使用pyappify打包exe

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          body: |
            ###  更新日志
              本次发布 ${{ github.ref_name }}
            ### 下载包说明
              * [ok-script-app-pro-win32-China-setup.exe](https://github.com/zengliugen/ok-script-app-pro/releases/download/${{ github.ref_name }}/ok-script-app-pro-win32-China-setup.exe) 完整安装包, 更新使用 GitHub.
              * [ok-script-app-pro-win32-Global-setup.exe](https://github.com/zengliugen/ok-script-app-pro/releases/download/${{ github.ref_name }}/ok-script-app-pro-win32-Global-setup.exe) full package with dependencies, using GitHub and PyPi as update source
              * [ok-script-app-pro-win32-Web-setup.exe](https://github.com/zengliugen/ok-script-app-pro/releases/download/${{ github.ref_name }}/ok-script-app-pro-win32-Web-setup.exe) web UI package with dependencies
          files: pyappify_dist/*

      # 默认关闭，需要在仓库 Variables 中设置 MIRRORCHYAN_ENABLED=true 才会触发上传
      - name: Trigger MirrorChyanUploading
        if: startsWith(github.ref, 'refs/tags/') && vars.MIRRORCHYAN_ENABLED == 'true'
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_uploading.yml -f tag=${{ github.ref_name }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
