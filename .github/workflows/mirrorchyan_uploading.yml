name: mirrorchyan_release

# 需要先在仓库 Settings > Secrets and variables > Actions 中配置：
#   Variables: MIRRORCHYAN_ENABLED = true （启用后才会上传）
#   Secrets:   MirrorChyanUploadToken
# 并在下方填写本项目的 mirrorchyan_rid。
on:
  workflow_dispatch:
    inputs:
        tag:
            default: ''
            required: false

jobs:
  mirrorchyan:
    runs-on: macos-latest
    if: ${{ vars.MIRRORCHYAN_ENABLED == 'true' }}

    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          # 安装包名带版本后缀（上游 1.1.3 起），用通配符匹配当次发布的文件
          filename: "ok-script-app-pro-win32-China-setup-*.exe"
          mirrorchyan_rid: ok-script-app-pro
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: zengliugen
          repo: ok-script-app-pro
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
