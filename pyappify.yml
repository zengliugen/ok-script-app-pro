name: "ok-script-app-pro"
uac: true
icon: "icons/icon.png"
profiles:
  - name: "China"
    git_url: "https://github.com/zengliugen/ok-script-app-pro.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
    use_pythonw: true
    show_add_defender: true
    # PYTHONPATH: "your/default/path" # Optional, will be "" if missing

  - name: "Global"
    git_url: "https://github.com/zengliugen/ok-script-app-pro.git"
    main_script: "main.py"
    requirements: "requirements.txt"
    pip_args: "--no-deps"

  - name: "Web"
    main_script: "web_main.py"
    requires_python: "3.12"
    requirements: "requirements-web.txt"
    pip_args: "--no-deps"
    use_pythonw: true
