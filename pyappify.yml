name: "ok-script-app-pro"
uac: true
icon: "icons/icon.png"
# 暂不启用 keep_releases：pyappify-action v1.2.3 的 trimRepo 在更新库只有预发布
# tag、clone 后没有分支 HEAD 时会 rev-parse HEAD 失败（实测 git 128）；更新库
# 目前只有约 10 MB，暂不需要裁剪。等动作/启动器版本修复后再评估。
# 更新库：用户安装与自动更新从这里拉取，只含 deploy.txt 白名单内的运行文件。
# 源码仓库只负责触发构建与托管 Release，不再作为更新源。
# 下游应用使用本模板时，必须把两个 profile 的 git_url 换成自己的更新库。
profiles:
  - name: "China"
    git_url: "https://github.com/zengliugen/ok-script-app-pro-update.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
    use_pythonw: true
    show_add_defender: true
    # PYTHONPATH: "your/default/path" # Optional, will be "" if missing

  - name: "Global"
    git_url: "https://github.com/zengliugen/ok-script-app-pro-update.git"
    main_script: "main.py"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
