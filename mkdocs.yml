site_name: ok-script-app-pro
site_description: ok-script-app-pro 是基于 ok-script-app 模板的扩展项目，扩展 Windows、Android 模拟器与浏览器自动化能力。
repo_name: zengliugen/ok-script-app-pro
repo_url: https://github.com/zengliugen/ok-script-app-pro
edit_uri: edit/dev/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: readthedocs
  locale: zh_CN

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - 中文:
      - 首页: index.md
      - 快速开始: getting-started.md
      - 应用配置: configuration.md
      - 任务开发: tasks.md
      - 扩展开发: extension-guide.md
      - 对上游的修改: upstream-changes.md
      - 打包与发布: release.md
      - 文档网站: documentation.md
  - English:
      - Home: en/index.md
      - Quick Start: en/getting-started.md
      - App Configuration: en/configuration.md
      - Task Development: en/tasks.md
      - Packaging and Release: en/release.md
      - Documentation Site: en/documentation.md
