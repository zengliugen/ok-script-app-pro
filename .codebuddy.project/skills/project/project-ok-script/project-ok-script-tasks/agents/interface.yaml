interface:
  display_name: "ok-script 任务开发"
  short_description: "创建与修改 ok-script 的 BaseTask 与 TriggerTask 任务类、配置元数据与注册"
  default_prompt: "使用 $project-ok-script-tasks 新建或修改 ok-script 任务：先读目标项目的基类与注册风格，再定任务类型、填元数据、声明配置、实现 run() 骨架并注册。run() 里的自动化动作交给 $project-ok-script-codegen，翻译交给 $project-ok-script-i18n。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "新建任务|加个任务|写个新任务"
      - keyword: "后台任务|触发任务|TriggerTask"
      - keyword: "BaseTask|任务类|任务基类"
      - keyword: "default_config|config_description|config_type"
      - keyword: "任务.*注册|注册.*任务"
      - keyword: "trigger_interval|_enabled"
  execution:
    context: "inline"
    shell: "powershell"
    environment:
      python: ">=3.12"
      packages:
        - "ok-script==2.0.0b7"
    artifacts:
      - "SKILL.md"
      - "references/task-api.md"
      - "references/templates.md"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: project-ok-script-tasks
version: "0.1.0"
mode: Production
