interface:
  display_name: "上游差异守护"
  short_description: "盘点本项目相对上游的代码差异、校验差异是否已登记、辅助生成登记条目"
  default_prompt: "当需要盘点上游差异、检查是否有未登记的上游改动、生成差异登记条目时使用此技能。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths:
      - ".codebuddy.project/configs/upstream/divergence.yaml"
      - "src/extensions/**"
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
