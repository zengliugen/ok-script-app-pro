interface:
  display_name: "扩展能力守卫"
  short_description: "体检扩展代码落位并委托 devflow-guard 体检文档契约，按三档报缺口"
  default_prompt: "使用 $project-extension-capability-guard audit 体检扩展代码落位（文档契约体检委托 devflow-guard）；新建能力文档请用 devflow-guard 的 explore/new。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "扩展能力"
      - keyword: "扩展文档"
      - keyword: "文档缺口"
      - keyword: "能力登记"
      - keyword: "扩展体检"
      - keyword: "代码落位"
  execution:
    context: "inline"
    shell: "bash"
    environment:
      python: ">=3.8"
      packages: []
    artifacts:
      - "SKILL.md"
      - "scripts/extension_capability_guard.py"
      - "references/trigger-eval.md"
      - "evals/trigger_cases.json"
      - "evals/semantic_config.json"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: project-extension-capability-guard
version: "0.2.0"
mode: Production
