interface:
  display_name: "扩展能力守卫"
  short_description: "生成扩展能力文档骨架并体检文档契约与代码落位，按三档报缺口"
  default_prompt: "使用 $project-extension-capability-guard new <能力名> 生成设计/计划/测试三份文档骨架并登记能力总览表；或使用 audit 体检文档契约与代码落位。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "扩展能力"
      - keyword: "扩展文档"
      - keyword: "文档缺口"
      - keyword: "能力登记"
      - keyword: "扩展体检"
      - keyword: "new 能力"
  execution:
    context: "inline"
    shell: "bash"
    environment:
      python: ">=3.8"
      packages: []
    artifacts:
      - "SKILL.md"
      - "scripts/extension_capability_guard.py"
      - "references/trigger-eval.md"
      - "evals/trigger_cases.json"
      - "evals/semantic_config.json"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: project-extension-capability-guard
version: "0.1.0"
mode: Production
