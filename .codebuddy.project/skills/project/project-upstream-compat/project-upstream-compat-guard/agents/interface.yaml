interface:
  display_name: "上游差异守护"
  short_description: "盘点本项目相对上游的代码差异、校验差异是否已登记、辅助生成登记条目"
  default_prompt: "使用 $project-upstream-compat-guard 盘点上游差异。运行校验脚本比对锚点与 HEAD 的差异与 divergence.yaml 登记清单，按输出标记给出处置动作。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    triggers:
      - keyword: "上游差异"
      - keyword: "上游改动"
      - keyword: "未登记"
      - keyword: "divergence"
      - keyword: "同步前检查"
  execution:
    context: "inline"
    shell: "bash"
    environment:
      python: ">=3.8"
      packages:
        - "PyYAML"
    artifacts:
      - "SKILL.md"
      - "scripts/upstream_compat_guard.py"
      - "references/output-interpretation.md"
      - "references/check-basis.md"
      - "references/boundaries.md"
      - "references/ownership-rules.md"
      - "references/trigger-eval.md"
      - "security/permission_policy.json"
      - "evals/trigger_cases.json"
      - "evals/semantic_config.json"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: project-upstream-compat-guard
version: "0.2.0"
mode: Production
