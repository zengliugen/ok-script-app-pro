interface:
  display_name: "上游同步"
  short_description: "执行上游 ok-script-app 的同步：master 前移、合并进 dev、解冲突、更新基准、验证提交"
  default_prompt: "使用 $project-upstream-compat-sync 执行上游同步。先跑 sync_guard.py check --stage before 确认方向未搞反，再按 master 快进 → dev 合并 → 解冲突 → 更新基准 → 验证的顺序执行。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
    - "codebuddy-code"
  activation:
    mode: "manual"
    paths: []
    triggers:
      - keyword: "同步上游"
      - keyword: "更新上游"
      - keyword: "跟进上游"
      - keyword: "上游有新版本"
      - keyword: "merge upstream"
      - keyword: "合入上游"
  execution:
    context: "inline"
    shell: "bash"
    environment:
      python: ">=3.8"
    artifacts:
      - "SKILL.md"
      - "scripts/sync_guard.py"
      - "references/sync-invariants.md"
      - "references/failure-handling.md"
      - "evals/trigger_cases.json"
      - "evals/semantic_config.json"
      - "agents/interface.yaml"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
    codebuddy-code: "native"
name: project-upstream-compat-sync
version: "0.1.0"
mode: Production
