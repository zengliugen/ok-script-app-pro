  # ---------- 接线点 ----------
  - path: src/config.py
    kind: M
    reason: 两处差异。① 末尾追加扩展 bootstrap 的唯一接线行（from extensions import bootstrap），这是项目扩展生效的唯一入口；② 窗口尺寸由上游 1200×800（最小 600×450）改为 1560×820 且最小值等于默认值，与 ok-script 3 的 ok/core/ui_config.py DEFAULT_WINDOW_SIZE 对齐——3.0 的左侧导航栏加任务页左右分栏在 1200 宽下过于拥挤，且最小尺寸小于默认值会让窗口被拖小后布局错乱
    method: patch-point
    authorization: 用户明确授权

  # ---------- 构建与发布必需 ----------
  - path: pyproject.toml
    kind: M
    reason: 两处差异。① 项目名由 ok-script-app 改为 ok-script-app-pro，打包与依赖安装均依赖该名称；② `[project].dependencies` 新增 networkx——场景管理能力的流转图寻路（最短路、连通性、布局坐标）依赖它，且寻路属运行期核心逻辑而非仅 GUI 用途，故放基础依赖而非 qt extra。networkx 为纯 Python 包，无原生编译件，不影响打包
    method: necessary
    authorization: 用户明确授权

  - path: requirements.txt
    kind: M
    reason: 由 pyproject.toml 编出的锁定文件新增 networkx==3.7（随场景管理能力引入）。注意该文件是 piptools 生成物，**不得手工编辑内容**，依赖变更应改 pyproject.toml 后重新编译。本次因编译时的依赖解析在网络受限环境下超时，按 piptools 的输出格式（版本行 + `# via` 注释、字母序位置）补齐单条，内容与实际安装版本一致
    method: necessary
    authorization: 用户明确授权

  - path: pyappify.yml
    kind: M
    reason: 打包配置指向本项目仓库与项目名；两个 profile 的 git_url 指向独立更新库 ok-script-app-pro-update——用户只克隆 deploy.txt 白名单内容，不再拉源码树与 .codebuddy 子模块；并用 keep_releases 30 限制更新库保留的发行 tag 数量，避免首次克隆拉取全部历史
    method: necessary
    authorization: 用户明确授权

  - path: .github/workflows/build.yml
    kind: M
    reason: 需 contents write 权限创建 Release；作者改为本项目；下载链接与产物名改本项目；保留并配置上游 partial-sync-repo 步骤（repos 指向本项目更新库、sync_list 为 deploy.txt、gitignore_file 为 .update_repo_gitignore），由 CI 在更新库创建同名 tag；测试步骤改为调用 run_tests.ps1（统一收集逻辑，避免 CI 与本地漂移）
    method: necessary
    authorization: 用户明确授权

  - path: deploy.txt
    kind: M
    reason: 新增 extensions 条目。本项目的运行时代码在 extensions/ 下（src/config.py 末尾依赖它启动），上游模板没有该目录，沿用上游清单会打出启动即 ImportError 的包；白名单是正向列举，漏写不会在构建期报错
    method: necessary
    authorization: 用户明确授权

  - path: run_tests.ps1
    kind: M
    reason: 上游只 glob tests/*.py 这一层，项目扩展测试在 extensions_tests/ 下会被漏测；改为遍历 tests 与 extensions_tests 两个根递归收集，并显式传文件路径给 unittest（discover 不递归无 __init__.py 的子目录）。另有三处项目必需差异：① 编码加 UTF-8 BOM——Windows PowerShell 5.1 读无 BOM 的 UTF-8 会退回 cp936，中文字符尾字节吞掉紧随的 ASCII 字符（引号/括号/换行），本文件原先因此有 2 处语法错误、脚本完全无法执行；② 含中文行用 CRLF，使被吞的是 CR 而非 LF，避免下一行并入注释造成「代码未执行却返回退出码 0」；③ 解释器优先用 .venv，裸 python 常解析到无 PySide6 的系统解释器，测试会以 ImportError 失败
    method: necessary
    authorization: 用户明确授权

