# 本项目已实现的扩展能力清单
#
# 用途：防止重复造轮子、便于交接时判断「某个能力当初用了什么手段、为什么」。
# 与 divergence.yaml 的区别：那份防冲突（记录改过哪些上游文件），这份记录做了什么能力。
# 字段定义见 .codebuddy.project/rules/project/upstream-compat/divergence-registry.mdc

updated_at: 2026-10-23

capabilities:
  - name: 底部右下角遮黑
    path: src/config.py
    method: override
    config_keys: [screenshot_processor]
    tests: []
    notes: 遮挡 UID，避免截图泄露；由上游模板自带，路径待迁移至 src/extensions/overrides.py

  - name: 自定义任务示例（一次性）
    path: src/tasks/MyOneTimeTask.py
    method: inherit
    config_keys: [onetime_tasks]
    tests: [tests/TestMain.py]
    notes: 演示配置控件全集；上游模板自带

  - name: 自定义任务示例（后台触发）
    path: src/tasks/MyTriggerTask.py
    method: inherit
    config_keys: [trigger_tasks]
    tests: []
    notes: 后台周期任务示例；上游模板自带

  - name: 自定义 Tab 示例
    path: src/ui/MyTab.py
    method: inherit
    config_keys: [custom_tabs]
    tests: []
    notes: 已定义类但 config 未注册 custom_tabs，当前不会被加载
